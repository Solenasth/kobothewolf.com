<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.title"></title>
    <meta name="description" data-i18n-content="meta.description" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kobothewolf.com/" />
    <meta property="og:title" data-i18n-content="meta.title" />
    <meta property="og:description" data-i18n-content="meta.description" />
    <meta property="og:image" content="https://kobothewolf.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" data-i18n-content="meta.ogImageAlt" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://kobothewolf.com/" />
    <link rel="alternate" hreflang="en" href="https://kobothewolf.com/?lang=en" />
    <link rel="alternate" hreflang="es" href="https://kobothewolf.com/?lang=es" />
    <link rel="alternate" hreflang="x-default" href="https://kobothewolf.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/theme/ui.css" />
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="nav.skip"></a>
    <div class="page">
      <header class="top">
        <nav data-i18n-aria-label="lang.label">
          <ul class="lang">
            <li><a href="?lang=en" hreflang="en" lang="en" data-lang="en" aria-current="true">EN</a></li>
            <li><a href="?lang=es" hreflang="es" lang="es" data-lang="es">ES</a></li>
          </ul>
        </nav>
        <a class="btn" href="#editor" data-i18n="nav.makeCard"></a>
      </header>

      <main id="main">
        <section class="profile" aria-labelledby="name">
          <h1 id="name">Kobo The Wolf</h1>
          <p class="pitch" data-i18n="profile.pitch"></p>
          <p class="experience" data-i18n="profile.experience"></p>
          <h2 class="label" data-i18n="profile.contact"></h2>
          <ul class="contact">
            <li><a href="https://t.me/KoboTheWolf" rel="me noopener"><span class="k">Telegram</span> <span class="v">@KoboTheWolf</span></a></li>
            <li><a href="mailto:contact@kobothewolf.com"><span class="k" data-i18n="profile.email"></span> <span class="v">contact@kobothewolf.com</span></a></li>
          </ul>

          <form id="inquiry" class="inquiry" novalidate hidden aria-labelledby="inquiry-title">
            <h2 id="inquiry-title" class="label" data-i18n="form.title"></h2>
            <p class="hint" data-i18n="form.intro"></p>
            <div class="fields">
              <div class="f">
                <label for="f-name" data-i18n="form.name"></label>
                <input id="f-name" name="name" autocomplete="name" maxlength="100" required aria-describedby="e-name" />
                <p id="e-name" class="err" hidden></p>
              </div>
              <div class="f">
                <label for="f-email" data-i18n="form.email"></label>
                <input id="f-email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="e-email" />
                <p id="e-email" class="err" hidden></p>
              </div>
              <div class="f">
                <label for="f-type" data-i18n="form.type"></label>
                <select id="f-type" name="type">
                  <option value="inquiry" data-i18n="form.type.inquiry"></option>
                  <option value="quote" data-i18n="form.type.quote"></option>
                </select>
              </div>
              <div class="f wide">
                <label for="f-message" data-i18n="form.message"></label>
                <textarea id="f-message" name="message" rows="5" maxlength="1500" required aria-describedby="e-message"></textarea>
                <p id="e-message" class="err" hidden></p>
              </div>
            </div>
            <div class="actions">
              <button type="submit" class="btn" data-i18n="form.send"></button>
              <button type="button" class="btn alt" data-action="copy" data-i18n="form.copy"></button>
            </div>
            <p class="status" role="status" aria-live="polite"></p>
          </form>

          <h2 class="label" data-i18n="profile.built.title"></h2>
          <p class="built">
            <span data-i18n="profile.built.text"></span>
            <a href="https://github.com/Solenasth/kobothewolf.com" data-i18n="profile.built.repo"></a> ·
            <a href="https://github.com/Solenasth/kobothewolf.com/blob/main/docs/REQUIREMENTS.md" data-i18n="profile.built.requirements"></a> ·
            <a href="https://github.com/Solenasth/kobothewolf.com/blob/main/docs/DESIGN.md" data-i18n="profile.built.design"></a> ·
            <a href="https://github.com/Solenasth/kobothewolf.com/tree/main/docs/decisions" data-i18n="profile.built.decisions"></a>
          </p>
          <details class="owo" id="owo">
            <summary data-i18n="profile.owo.button"></summary>
            <div class="owo-panel">
              <p data-i18n="profile.owo.intro"></p>
              <ul>
                <li data-i18n="profile.owo.private"></li>
                <li data-i18n="profile.owo.process"></li>
                <li data-i18n="profile.owo.tech"></li>
              </ul>
              <a href="/how-it-works.html" data-i18n="profile.owo.details"></a>
            </div>
          </details>
        </section>

        <section id="editor" class="editor" aria-labelledby="editor-title">
          <h2 id="editor-title" data-i18n="editor.title"></h2>
          <div id="editor-root">
            <p data-i18n="editor.loading" hidden></p>
            <noscript><p data-i18n="editor.noscript"></p></noscript>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
