name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:playwright-image
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build
      # DESIGN §5.6: the E2E test hook is compiled in only with VITE_TEST_HOOK=1.
      - name: No test hook in the deploy build
        run: "! grep -rl __kobo dist"
      # DESIGN §5.5: jsPDF's optional html2canvas, DOMPurify and canvg stay out of the bundle.
      - name: No jsPDF optional modules in the build
        run: if ls dist/assets | grep -E '^(html2canvas|purify)' || grep -l Canvg dist/assets/*.js; then exit 1; fi
      - run: npm audit

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system packages come preinstalled, so the job skips
    # apt and the browser download (#26). The tag must equal @playwright/test;
    # `npm run check:playwright-image` enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute@sha256:d89d0e4a7058330a8334306a5aef1e00807863d31af27cf11348eed696d6e0ba
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.browser }}
      # NFR-2: report how long one face's export took on this runner.
      - name: Export time
        if: ${{ !cancelled() }}
        run: |
          if [ -d test-results/export-times ]; then
            { echo "### PNG export time (${{ matrix.browser }})"; cat test-results/export-times/*.txt; } >> "$GITHUB_STEP_SUMMARY"
            cat test-results/export-times/*.txt
          fi
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
      # The code-cat text as drawn in this browser, for the rustc job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-cat-${{ matrix.browser }}
          path: test-results/code-cat/
          if-no-files-found: error
          retention-days: 7

  export:
    name: export (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FR-B2, DESIGN §9, §10: every variant's PNGs and PDF, exported through the
    # editor in this browser, with their manifests, for the check-exports job.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute@sha256:d89d0e4a7058330a8334306a5aef1e00807863d31af27cf11348eed696d6e0ba
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run exports:render -- --project=${{ matrix.browser }}
      # FR-B1, DESIGN §9: a mixed card's vector PDF, made by Chromium and
      # checked by check-exports (found as <name>.pdf beside <name>.kobo.json).
      - name: Vector PDF
        if: matrix.browser == 'chromium'
        run: |
          mkdir -p exports/chromium/vector
          cp tests/fixtures/documents/mezcla.kobo.json exports/chromium/vector/
          npm run kobo -- pdf-vector exports/chromium/vector/mezcla.kobo.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exports-${{ matrix.browser }}
          path: exports/
          if-no-files-found: error
          retention-days: 14

  check-exports:
    name: check-exports
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs outside the Playwright image, whose user can't install poppler.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: exports-*
          merge-multiple: true
          path: exports
      - name: Check the exports
        run: |
          set -o pipefail
          npm run -s kobo -- check-exports exports | tee check-exports.txt
      - name: Report
        if: ${{ !cancelled() }}
        run: |
          if [ -f check-exports.txt ]; then
            { echo '### check-exports'; echo '```'; cat check-exports.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # The check's own tests, with poppler required so the PDF cases can't skip.
      - run: npm run gen && npx vitest run tests/check-exports.test.ts tests/font-cmap.test.ts
        env:
          KOBO_REQUIRE_POPPLER: 1

  rustc:
    name: rustc (code cat)
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # FR-E20, DESIGN §5.4: the program drawn inside the cat compiles with no
    # warnings in every browser's layout, and runs.
    env:
      RUST_VERSION: 1.99.1
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: code-cat-*
          merge-multiple: true
          path: code-cat
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Compile and run each browser's text
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(code-cat/*.rs)
          [ "${#files[@]}" -eq 3 ] || { echo "expected 3 files, found ${#files[@]}"; exit 1; }
          rustc +"$RUST_VERSION" --version
          for f in "${files[@]}"; do
            rustc +"$RUST_VERSION" --edition 2021 -D warnings -o "${f%.rs}" "$f"
            "${f%.rs}" > "${f%.rs}.out"
          done
          cmp code-cat/chromium.out code-cat/firefox.out
          cmp code-cat/chromium.out code-cat/webkit.out
          tail -n 1 code-cat/chromium.out | grep -qx 'operational. ✔'

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
