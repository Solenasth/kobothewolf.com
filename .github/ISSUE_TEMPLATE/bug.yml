name: Bug
description: Something does not behave as REQUIREMENTS.md says
title: "fix(<scope>): <summary>"
labels: [bug]
body:
  - type: input
    id: reqs
    attributes: { label: Requirement broken, placeholder: "FR-…" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: Browser, language, steps. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
    validations: { required: true }
  - type: textarea
    id: test
    attributes: { label: Failing test, description: The fix starts with a test that reproduces this. }
